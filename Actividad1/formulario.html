<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esport Formulari</title>
</head>
<body>
    <form action="#" method="post">
        <label for="name">Nom:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Correu electrònic:</label>
        <input type="email" id="email" name="email" required><br><br>

        <p>Esport preferit:</p>
        <input type="radio" id="futbol" name="sport" value="futbol">
        <label for="futbol">Futbol</label><br>
        <input type="radio" id="basketball" name="sport" value="basketball">
        <label for="basketball">Bàsquet</label><br>
        <input type="radio" id="tennis" name="sport" value="tennis">
        <label for="tennis">Tennis</label><br><br>

        <label for="options">Tria una opció:</label>
        <select id="options" name="options">
            <option value="opcio1">Opció 1</option>
            <option value="opcio2">Opció 2</option>
            <option value="opcio3">Opció 3</option>
        </select><br><br>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
